<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STYLE AGAIN — Admin Dashboard</title><link rel="stylesheet" href="styles.css"></head><body><header><a class="logo" href="index.html">STYLE AGAIN<span>.</span></a><div><button class="filter-btn" onclick="logout()">LOG OUT</button></div></header><main class="admin-dashboard"><div class="section-head"><div><p class="eyebrow">CONTROL CENTER</p><h2>ADMIN DASHBOARD</h2></div></div><div id="notice" class="admin-notice">🔔 Push notification status: checking…</div><button class="filter-btn" id="enablePush" onclick="enablePush()" style="margin:10px 0">ENABLE PHONE NOTIFICATIONS</button><div class="admin-stats"><div><b id="orders">0</b><span>ORDERS</span></div><div><b id="pending">0</b><span>PENDING CONFIRMATION</span></div><div><b id="revenue">₹0</b><span>ORDER VALUE</span></div></div><section class="admin-box"><div class="admin-section-title"><div><p class="eyebrow">INVENTORY CONTROL</p><h3>PRODUCTS</h3></div><button class="green admin-add" onclick="openProductForm()">+ ADD PRODUCT</button></div><div id="productsList"></div></section>
<section class="admin-box"><h3>ORDERS</h3><div id="ordersList"></div></section></main><div class="product-modal" id="productModal"><div class="product-modal-card"><div class="panel-head"><h2 id="productTitle">ADD PRODUCT</h2><button class="close" onclick="closeProductForm()">×</button></div><form id="productForm" onsubmit="event.preventDefault();saveProduct()"><div class="form-grid"><div><label>Product name</label><input class="field" id="p_name" required><label>Category</label><select class="field" id="p_category"><option>T-Shirts</option><option>Hoodies</option><option>Jackets</option><option>Pants</option><option>Other</option></select><label>Price</label><input class="field" id="p_price" type="number" required><label>Original price</label><input class="field" id="p_old_price" type="number"><label>Stock</label><input class="field" id="p_stock" type="number" min="0" required><label>Sizes (comma separated)</label><input class="field" id="p_sizes" placeholder="S, M, L, XL"><label>Condition</label><input class="field" id="p_condition" value="9/10"><label>Description</label><textarea class="field" id="p_description"></textarea></div><div><label>Product image</label><div id="imageDrop" class="image-drop">DRAG & DROP IMAGE HERE<br><small>or click to choose</small><input id="p_image" type="file" accept="image/*"></div><div id="imagePreview" class="image-preview">DRAG & DROP IMAGE HERE</div></div></div><button class="green" type="submit">SAVE PRODUCT</button></form></div></div><script>
let known=0;
function b64ToUint8(b64){b64=b64.replace(/-/g,'+').replace(/_/g,'/');const pad='='.repeat((4-b64.length%4)%4);return Uint8Array.from(atob(b64+pad),c=>c.charCodeAt(0));}
async function enablePush(){
 const btn=document.getElementById('enablePush');
 if(!('serviceWorker' in navigator)||!('PushManager' in window)){document.getElementById('notice').textContent='⚠️ This browser does not support phone push notifications.';return false;}
 try{
  const reg=await navigator.serviceWorker.register('/sw.js');
  const permission=await Notification.requestPermission();
  if(permission!=='granted'){document.getElementById('notice').textContent='⚠️ Notification permission was not granted.';return false;}
  const kr=await fetch('/api/push/public-key'); const kd=await kr.json();
  let sub=await reg.pushManager.getSubscription();
  if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToUint8(kd.public_key)});
  const sr=await fetch('/api/admin/push/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sub.toJSON())});
  if(!sr.ok) throw new Error('subscription save failed');
  btn.textContent='PHONE NOTIFICATIONS ENABLED'; btn.disabled=true; document.getElementById('notice').textContent='🟢 Phone push notifications enabled'; return true;
 }catch(e){console.error(e);document.getElementById('notice').textContent='⚠️ Could not enable phone notifications.';return false;}
}
async function load(){
 let r=await fetch('/api/admin/orders');if(r.status===401){location.href='admin.html';return}let d=await r.json();let orders=d.orders;
 document.getElementById('orders').textContent=orders.length;document.getElementById('pending').textContent=orders.filter(o=>o.status==='Payment screenshot pending').length;document.getElementById('revenue').textContent='₹'+orders.reduce((a,o)=>a+Number(o.total),0).toLocaleString();
 document.getElementById('ordersList').innerHTML=orders.length?orders.map(o=>`<div class="admin-order"><div class="order-details"><h3>Order ${o.order_id}</h3><div class="detail-grid"><div><b>Customer Name</b><span>${o.name}</span></div><div><b>Phone Number</b><span>${o.phone}</span></div><div><b>Email</b><span>${o.email||'—'}</span></div><div><b>Address</b><span>${o.address}</span></div><div><b>Pincode</b><span>${o.pin}</span></div><div><b>Size</b><span>${o.size||'—'}</span></div><div><b>Price</b><span>₹${Number(o.total).toLocaleString()}</span></div><div><b>Ordered Date & Time</b><span>${new Date(o.created_at).toLocaleString()}</span></div></div><div class="ordered-items"><b>Ordered Product(s)</b><p>${o.items}</p></div></div><select onchange="setStatus('${o.order_id}',this.value)"><option ${o.status==='Payment screenshot pending'?'selected':''}>Payment screenshot pending</option><option ${o.status==='Confirmed'?'selected':''}>Confirmed</option><option ${o.status==='Packed'?'selected':''}>Packed</option><option ${o.status==='Shipped'?'selected':''}>Shipped</option><option ${o.status==='Delivered'?'selected':''}>Delivered</option><option ${o.status==='Cancelled'?'selected':''}>Cancelled</option></select></div>`).join(''):'<p>No orders yet.</p>';
 if(known && orders.length>known){document.title='🔔 NEW ORDER — STYLE AGAIN';}
 known=orders.length;
}
async function setStatus(id,status){await fetch('/api/admin/order/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}
async function logout(){await fetch('/api/admin/logout',{method:'POST'});location.href='admin.html'}
load();

let editingId=null;
async function loadProductsAdmin(){let r=await fetch('/api/products');if(!r.ok)return;let d=await r.json();document.getElementById('productsList').innerHTML=d.products.length?d.products.map(p=>`<div class="product-admin-row"><div class="admin-product-thumb" style="${p.image?`background-image:url('${p.image}')`:''}">${p.image?'':'IMG'}</div><div class="product-admin-info"><b>${p.name}</b><span>${p.category} • ₹${Number(p.price).toLocaleString()} • Stock ${p.stock}</span><span>Sizes: ${(p.sizes||[]).join(', ')||'—'} • Condition ${p.condition||'—'}</span></div><div class="product-actions"><button onclick='editProduct(${JSON.stringify(p)})'>EDIT</button><button class="danger" onclick="deleteProduct(${p.id})">DELETE</button></div></div>`).join(''):'<p>No products yet.</p>'}
function openProductForm(p=null){editingId=p?.id||null;document.getElementById('productModal').classList.add('open');document.getElementById('productForm').reset();document.getElementById('productTitle').textContent=editingId?'EDIT PRODUCT':'ADD PRODUCT';document.getElementById('imagePreview').style.backgroundImage='';document.getElementById('imagePreview').textContent='DRAG & DROP IMAGE HERE';if(p){['name','category','price','old_price','stock','condition','description'].forEach(k=>document.getElementById('p_'+k).value=p[k]??'');document.getElementById('p_sizes').value=(p.sizes||[]).join(', ');if(p.image){document.getElementById('imagePreview').style.backgroundImage=`url('${p.image}')`;document.getElementById('imagePreview').textContent=''}}}
function editProduct(p){openProductForm(p)}
function closeProductForm(){document.getElementById('productModal').classList.remove('open')}
let imageData='';
function handleImage(file){if(!file||!file.type.startsWith('image/'))return;let rd=new FileReader();rd.onload=()=>{imageData=rd.result;document.getElementById('imagePreview').style.backgroundImage=`url('${imageData}')`;document.getElementById('imagePreview').textContent=''};rd.readAsDataURL(file)}
async function saveProduct(){let payload={name:document.getElementById('p_name').value.trim(),category:document.getElementById('p_category').value,price:Number(document.getElementById('p_price').value),old_price:Number(document.getElementById('p_old_price').value||0),stock:Number(document.getElementById('p_stock').value||0),sizes:document.getElementById('p_sizes').value.split(',').map(x=>x.trim()).filter(Boolean),condition:document.getElementById('p_condition').value,description:document.getElementById('p_description').value.trim(),image:imageData||''};if(!payload.name||!payload.category){alert('Product name and category are required.');return}let url=editingId?'/api/admin/products/'+editingId:'/api/admin/products',method=editingId?'PUT':'POST';let r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok){alert('Could not save product.');return}closeProductForm();imageData='';loadProductsAdmin()}
async function deleteProduct(id){if(!confirm('Delete this product?'))return;let r=await fetch('/api/admin/products/'+id,{method:'DELETE'});if(r.ok)loadProductsAdmin();else alert('Could not delete product.')}
const drop=document.getElementById('imageDrop');drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag')});drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('drag');handleImage(e.dataTransfer.files[0])});document.getElementById('p_image').addEventListener('change',e=>handleImage(e.target.files[0]));
loadProductsAdmin();
</script></body></html>
