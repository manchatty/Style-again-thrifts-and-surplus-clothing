<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STYLE AGAIN — Admin Login</title><link rel="stylesheet" href="styles.css"></head><body><div class="admin-wrap"><div class="admin-card"><div class="logo">STYLE AGAIN<span>.</span></div><p class="eyebrow">STORE ADMIN</p><h1>ADMIN LOGIN</h1><input class="field" id="adminId" placeholder="Admin ID"><input class="field" id="adminPass" type="password" placeholder="Password"><button class="green" onclick="login()">LOGIN</button><p id="err" style="color:#b22;font-size:12px"></p><p style="font-size:11px;color:#777">Orders and notifications are now handled by the Flask backend.</p></div></div><script>async function enablePush(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){return false;}
  try{
    const reg=await navigator.serviceWorker.register('/sw.js');
    const permission=await Notification.requestPermission();
    if(permission!=='granted') return false;
    const keyRes=await fetch('/api/push/public-key'); const keyData=await keyRes.json();
    const b64=keyData.public_key.replace(/-/g,'+').replace(/_/g,'/'); const pad='='.repeat((4-b64.length%4)%4);
    const applicationServerKey=Uint8Array.from(atob(b64+pad),c=>c.charCodeAt(0));
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey});
    await fetch('/api/admin/push/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sub.toJSON())});
    return true;
  }catch(e){console.error(e);return false;}
}
async function login(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:document.getElementById('adminId').value,password:document.getElementById('adminPass').value})});if(r.ok){await enablePush();location.href='admin-dashboard.html';}else document.getElementById('err').textContent='Invalid Admin ID or Password';}</script></body></html>
